# NetworkPolicy lets you define which network traffic can reach the application's Pods.
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "k8s-platform.fullname" . }}-ingress
  labels:
    {{- include "k8s-platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "k8s-platform.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
{{- end }}